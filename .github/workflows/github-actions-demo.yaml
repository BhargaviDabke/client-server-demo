name: GitHub action demo
on:
  push:
    branches:
      - dev

jobs:
  Bye:
    runs-on: ubuntu-latest
    needs: Greetings
    steps:
      - name: Send goodbye message
        run: echo "Good bye"

  Greetings:
    runs-on: ubuntu-latest
    steps:
      - name: Greeting
        run: |
          echo "Hello"
          echo "Good morning"
